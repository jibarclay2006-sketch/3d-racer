<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A little liquid in your phone. Tilt, shake, and stir a pocket-sized FLIP water simulation.">
<title>Pocket Fluid</title>
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<canvas id="fluid" aria-label="Interactive green liquid. Drag to stir; use arrow keys to tilt." tabindex="0"></canvas>
<header id="hud"><div class="wordmark">POCKET <b>FLUID</b></div><span id="status">Drag to stir</span></header>
<div id="tip" role="status" aria-live="polite"></div>
<nav id="toolbar" aria-label="Simulation controls">
<button id="motion" class="primary">Enable motion</button>
<label class="level-control"><span class="sr-only">Level</span><select id="level" aria-label="Level"><option value="bottle">Empty bottle</option><option value="slides">Slides</option><option value="funnel">Funnel</option><option value="pins">Pins</option></select></label>
<button id="settings" class="icon" aria-label="Open settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
</nav>
<button id="restore" aria-label="Show controls">•••</button>
<dialog id="panel" aria-labelledby="settings-title">
<div class="panel-head"><h1 id="settings-title">Make it yours.</h1><button id="close" class="icon" aria-label="Close settings">×</button></div>
<div class="setting"><label for="fill">Water amount</label><output id="fill-value" for="fill">34%</output><input id="fill" type="range" min="15" max="60" step="1" value="34"></div>
<div class="setting"><label for="response">Motion strength</label><output id="response-value" for="response">1.0×</output><input id="response" type="range" min="0.6" max="1.6" step="0.1" value="1"></div>
<fieldset><legend>Look</legend><div class="segments"><button id="dots" aria-pressed="true">Pixels</button><button id="water" aria-pressed="false">Liquid</button></div></fieldset>
<div class="actions"><button id="reset">Refill</button><button id="splash">Splash</button><button id="fullscreen">Fullscreen</button><button id="hide">Hide controls</button></div>
<p class="help">Tilt to pour. Shake to splash. Drag to stir.<br>On a keyboard, hold the arrow keys to tilt.</p>
<p class="credit">Inspired by <a href="https://mitxela.com/projects/flipflip" target="_blank" rel="noopener">mitxela</a> · Fluid method by <a href="https://matthias-research.github.io/pages/tenMinutePhysics/" target="_blank" rel="noopener">Ten Minute Physics</a></p>
</dialog>
<noscript>This fluid simulation needs JavaScript enabled.</noscript>
<script type="module" src="./app.js?v=3"></script>
</body>
</html>
